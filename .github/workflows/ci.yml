name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `--ignore-scripts`: skip the `prepare` hook (build runs explicitly later).
      # `--omit=optional`: skip platform-specific optional transitive deps
      #   (@emnapi/*, etc.) whose Linux variants aren't in the lockfile because
      #   it was generated on macOS. Our code doesn't use them.
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
