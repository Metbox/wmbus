name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Use `npm install` (not `npm ci`) because the lockfile is regenerated
      # locally on macOS — its optional-dep tree doesn't match Linux exactly
      # (e.g. @emnapi/* variants). `npm install` tolerates that; `npm ci`
      # refuses. `--ignore-scripts` skips the `prepare` build (we run it
      # explicitly below).
      - run: npm install --ignore-scripts --no-save
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
