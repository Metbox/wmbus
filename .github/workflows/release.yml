name: Release

on:
  push:
    branches: [develop]

# `contents: write` lets the workflow push the "chore: release" commit,
# create/update the Version Packages PR, push tags, and create GitHub Releases.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Changesets can compute the changelog diff.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # `--ignore-scripts` skips the `prepare` hook (which builds). We
      # run `npm run build` explicitly below.
      - run: npm ci --ignore-scripts

      - run: npm test

      - run: npm run build

      # If pending changesets exist, this opens / updates the
      # "Version Packages" PR that bumps `package.json` and rolls the
      # changesets into CHANGELOG.md. Once that PR merges, this step
      # runs again and produces no PR — which means `hasChangesets` is
      # false and the tag step below runs.
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Idempotent: creates `v<version>` git tag + GitHub Release only
      # when the current version has no matching tag yet. That's the
      # case exactly once per merged Version Packages PR.
      - name: Tag and release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
          # Extract the section for this version from CHANGELOG.md (which
          # Changesets just populated) and use it as release notes.
          NOTES=$(awk -v ver="## ${VERSION}" '
            $0 == ver { flag=1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "${NOTES}" ]; then
            NOTES="Release ${TAG}. See CHANGELOG.md."
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "${NOTES}" \
            --verify-tag
