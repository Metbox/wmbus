name: Publish to npm

# Fires when you click "Publish release" on a manually-created GitHub Release.
# The release + tag are created in the UI (by you) — no Actions writes needed.
# This workflow is purely reactive: build, test, publish to npm.
on:
  release:
    types: [published]

permissions:
  # `contents: read` = checkout. `id-token: write` = OIDC attestation
  # for npm Trusted Publishers — no NPM_TOKEN needed, auth happens via
  # the GitHub Actions OIDC provider which npm cross-verifies against
  # the trusted-publisher config set on the package on npmjs.com.
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      # `npm install` not `npm ci` because the lockfile is generated on macOS
      # (optional-dep variants differ between platforms). `--ignore-scripts`
      # skips the `prepare` hook; `npm publish` will run it automatically.
      - run: npm install --ignore-scripts --no-save

      - run: npm test

      - run: npm run build

      # Guard: the git tag on the release must match `v<package.json version>`.
      # Prevents publishing 0.1.0 when the tag says v0.2.0 and vice versa.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION}. Expected v${PKG_VERSION}."
            exit 1
          fi

      # No NODE_AUTH_TOKEN — `npm publish` uses the OIDC token from
      # GitHub Actions to authenticate with npm. Requires a trusted-
      # publisher config on @metbox/wmbus matching repo=Metbox/wmbus
      # and workflow=release.yml.
      - run: npm publish --provenance
